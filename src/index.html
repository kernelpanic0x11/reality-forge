<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reality Forge</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#cccccc;font:12px "Courier New",monospace}main{height:100dvh;display:flex;flex-direction:column;padding:10px;gap:10px}header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:32px}h1{font-size:12px;letter-spacing:1.6px;margin:0 8px 0 2px}button,select{height:30px;background:#111111;color:inherit;border:1px solid #333333;border-radius:2px;padding:0 9px;font:inherit}button{cursor:pointer}button:hover,select:hover{border-color:#00ff41}button.primary{background:#00ff41;border-color:#00ff41;color:#0a0a0a;font-weight:700}button.live{background:#7a0c0c;border-color:#ff0000;color:#ffffff}button:disabled{opacity:.6;cursor:default}#start{min-width:64px}#camera,#audioInput{max-width:195px}label{display:flex;align-items:center;gap:4px;color:#999999}input{accent-color:#00ff41}[hidden]{display:none!important}input[type=number]{width:54px;height:30px;background:#111111;color:inherit;border:1px solid #333333;border-radius:2px;padding:0 6px;font:inherit}#status{margin-left:auto;color:#00ff41;font-size:11px;max-width:35vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}canvas#stage{display:block;width:100%;height:0;flex:1;min-height:0;object-fit:contain;background:#050505;border-radius:2px}video{display:none}#stage:fullscreen{width:100vw;height:100vh;border-radius:0;background:#000}@media(max-width:650px){h1{display:none}header{gap:5px}#camera{max-width:130px}#status{width:100%;max-width:none;margin:0}main{padding:6px;gap:6px}}
</style></head><body><main>
<header aria-label="Camera controls"><h1>REALITY FORGE</h1><select id="mode" aria-label="Mode" title="Mode"><option value="object">Object</option><option value="guitar">Guitar</option></select><select id="camera" aria-label="Camera" title="Camera"><option value="">Camera</option></select><button class="primary" id="start" title="Start the selected camera">Start</button><select id="rotation" aria-label="Rotation" title="Rotation"><option value="90">90°</option><option value="270">270°</option><option value="0">0°</option><option value="180">180°</option></select><label title="Mirror camera"><input id="mirror" type="checkbox" checked>Mirror</label><label title="Show hand and finger joints"><input id="joints" type="checkbox" checked>Joints</label> <select id="audioInput" aria-label="Audio input" title="Guitar mode: audio input" hidden><option value="">Default audio input</option></select> <label id="statsLabel" title="Guitar mode: show the stats panel and hand boxes (leave off for a clean recording)" hidden><input id="stats" type="checkbox">Stats</label><label id="leftyLabel" title="Guitar mode: left-handed player (fret with the right hand)" hidden><input id="lefty" type="checkbox">Lefty</label><button id="reset" title="Reset effect">Reset</button> <button id="record" title="Record the picture (with the overlay, without the toolbar) and the audio input to a video file on this Mac. Click again to stop and save.">Record</button><button id="clip"  title="Guitar mode: record up to 30 seconds of the audio input to this Mac as a test clip. Click again to stop early and save." hidden>Save clip</button><button id="snapshot" title="Save one still frame to the logs folder on this Mac, for troubleshooting">Snapshot</button><button id="calibrate" title="Calibrate depth: type your distance from the camera, click, then hold an open hand beside your face. Shift-click to clear.">Calibrate</button><label title="Your distance from the camera during Calibrate, in cm"><input id="distance" type="number" value="100" min="20" max="500" step="5" aria-label="Calibration distance in cm">cm</label><button id="full" title="Fullscreen" aria-label="Fullscreen">⛶</button><span id="status" role="status">Ready</span></header>
<canvas id="stage" width="720" height="1280"></canvas><video id="video" playsinline muted></video>
</main><script type="module" src="app.js"></script>
<script>
// If the app's code fails to load, say so on screen and in the session log
// instead of leaving a page that looks ready but does nothing.
addEventListener('load', () => setTimeout(() => {
  if (window.liveLab) return;
  document.getElementById('status').textContent = 'The app failed to load. Reload the page.';
  fetch('/log', { method: 'POST', body: JSON.stringify({ t: new Date().toISOString(), session: 'load-failure', event: 'error', where: 'page load', text: 'app.js or one of its modules did not load' }) + '\n' }).catch(() => {});
}, 3000));
</script></body></html>
